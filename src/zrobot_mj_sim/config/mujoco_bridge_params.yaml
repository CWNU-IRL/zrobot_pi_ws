mujoco_motor_bridge_node:
  ros__parameters:
    # 统一 0..22 契约；MuJoCo 只驱动前 active_joint_count 个关节，其余补 0。
    active_joint_count: 12
    joint_names:
      - L_hip_roll_joint
      - L_hip_yaw_joint
      - L_hip_pitch_joint
      - L_knee_joint
      - L_foot_pitch_joint
      - L_foot_roll_joint
      - R_hip_roll_joint
      - R_hip_yaw_joint
      - R_hip_pitch_joint
      - R_knee_joint
      - R_foot_pitch_joint
      - R_foot_roll_joint
      - joint_12
      - joint_13
      - joint_14
      - joint_15
      - joint_16
      - joint_17
      - joint_18
      - joint_19
      - joint_20
      - joint_21
      - joint_22
    kp: [120.0, 120.0, 120.0, 120.0, 80.0, 80.0, 120.0, 120.0, 120.0, 120.0, 80.0, 80.0]
    kd: [1.0, 1.0, 1.0, 1.0, 3.0, 3.0, 1.0, 1.0, 1.0, 1.0, 3.0, 3.0]
    control_mode: "torque_pd"
    control_frequency: 200.0
    feedback_temperature: 35.0
    publish_joint_states: true
    publish_imu: true
    publish_clock: true
    base_frame: "base_link"
    imu_frame: "imu"
    model_path: ""
    position_model_path: ""
    command_timeout_ms: 300
    damping_kd: 1.0
    state_publish_hz: 100.0
    telemetry_hz: 10.0
